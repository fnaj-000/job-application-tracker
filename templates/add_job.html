{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4">Add Job Listing</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Company</label>
                    <select class="form-control" name="company_id" required>
                        <option value="">Select a Company</option>
                        {% for company in companies %}
                        <option value="{{ company.company_id }}">{{ company.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" class="form-control" name="job_title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location">
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Type (e.g., Remote, Hybrid, On-site)</label>
                    <input type="text" class="form-control" name="job_type">
                </div>
                <div class="mb-3">
                    <label class="form-label">Salary Range</label>
                    <input type="text" class="form-control" name="salary_range">
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-control" name="status">
                        <option value="Open">Open</option>
                        <option value="Applied">Applied</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea class="form-control" name="job_description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Save Job</button>
                <a href="{{ url_for('jobs') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
